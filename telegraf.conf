[agent]
  interval = "10s"
  flush_interval = "10s"

# ---- INPUT: pulsopnaat/status ----
[[inputs.mqtt_consumer]]
  name_override = "pulsopnaat_status"
  servers = ["${MQTT_BROKER}"]
  topics = ["pulsopnaat/status"]
  data_format = "json"

  # "node" vira tag, assim dá pra filtrar/agrupar por equipamento no Grafana
  tag_keys = ["node"]

  # Por padrão o parser JSON do Telegraf só converte valores NUMÉRICOS em fields.
  # Strings são descartadas silenciosamente a menos que sejam listadas aqui.
  json_string_fields = ["maquina", "equipamento"]

  qos = 0
  client_id = "pulsopnaat-tcc14-telegraf-status"

# ---- INPUT: pulsopnaat/alert ----
[[inputs.mqtt_consumer]]
  name_override = "pulsopnaat_alert"
  servers = ["${MQTT_BROKER}"]
  topics = ["pulsopnaat/alert"]
  data_format = "json"

  tag_keys = ["node"]

  # Mesmo motivo: "estado" é string e precisa ser listado explicitamente.
  json_string_fields = ["estado"]

  qos = 0
  client_id = "pulsopnaat-tcc14-telegraf-alert"

# ---- INPUT: pulsopnaat/telemetria (1 mensagem por janela: 18 métricas, estado, score, rótulo) ----
[[inputs.mqtt_consumer]]
  name_override = "pulsopnaat_telemetria"
  servers = ["${MQTT_BROKER}"]
  topics = ["pulsopnaat/telemetria"]
  data_format = "json"

  tag_keys = ["node"]
  json_string_fields = ["maquina", "equipamento", "rotulo"]

  qos = 0
  client_id = "pulsopnaat-tcc14-telegraf-telemetria"

# ---- OUTPUT: write to InfluxDB 2.x ----
# Credenciais via ambiente (compose injeta do .env); defaults = bancada local.
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"

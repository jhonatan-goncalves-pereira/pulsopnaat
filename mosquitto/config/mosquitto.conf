# Stack de observabilidade do PulsoPNAAT: MQTT → Telegraf → InfluxDB → Grafana.
#
# Como subir:
#   cp .env.example .env   # uma vez por máquina (o .env não vai para o Git)
#   docker compose up -d
#
# O que sobe:
# - Mosquitto em localhost:1883 (MQTT) e localhost:9001 (websockets)
# - InfluxDB 2.x em localhost:8086 (org/bucket/token vêm do .env)
# - Telegraf, inscrito em pulsopnaat/status e pulsopnaat/alert, gravando no InfluxDB
# - Grafana em localhost:3000 (datasource InfluxDB já provisionado; ver § Conectar o Grafana)
listener 1883
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

# NOTA: allow_anonymous + sem TLS vale SÓ para bancada local.
# Antes de expor em qualquer rede, exigir usuário/senha (ou TLS) e trocar os
# segredos do .env.

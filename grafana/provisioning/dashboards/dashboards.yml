# Carrega todo JSON de ./json na pasta PulsoPNAAT do Grafana (releitura a cada 10 s).
# Principal: pulsopnaat-monitoramento.json (uid pulsopnaat-monitor).
apiVersion: 1

providers:
  - name: pulsopnaat
    folder: PulsoPNAAT
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json

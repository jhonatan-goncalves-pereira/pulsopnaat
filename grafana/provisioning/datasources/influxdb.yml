# Datasource InfluxDB (Flux) provisionado no boot do Grafana. uid fixo pulsopnaat-influxdb:
# os dashboards em ../dashboards/json referenciam esse uid. Org, bucket e token vêm do .env.
apiVersion: 1

datasources:
  - name: InfluxDB
    uid: pulsopnaat-influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: ${INFLUXDB_ORG}
      defaultBucket: ${INFLUXDB_BUCKET}
    secureJsonData:
      token: ${INFLUXDB_TOKEN}
    isDefault: true
    editable: true

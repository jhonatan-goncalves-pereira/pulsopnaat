# Stack de observabilidade do PulsoPNAAT: nó ESP32 → broker MQTT → Telegraf → InfluxDB → Grafana.
# Segredos e portas vêm do .env (modelo em .env.example; o .env nunca vai para o Git).
#   docker compose up -d                      bancada local (Grafana em localhost:${GRAFANA_PORT})
#   docker compose --profile online up -d     idem + link público do Grafana (serviço tunel)
# Windows sem Docker Desktop: tools/stack/subir_stack_wsl.ps1 [-Online]. Detalhes em README_DOCKER.md.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # MQTT over websockets (opcional)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USERNAME:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD:-adminpassword}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-myorg}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-mqtt_data}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:-my-super-secret-admin-token}
    volumes:
      - influxdb-data:/var/lib/influxdb2

  telegraf:
    image: telegraf:1.30
    container_name: telegraf
    restart: unless-stopped
    depends_on:
      - mosquitto
      - influxdb
    environment:
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-my-super-secret-admin-token}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-myorg}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-mqtt_data}
      # Onde o nó publica: broker público da bancada por padrão; tcp://mosquitto:1883 para o broker local
      - MQTT_BROKER=${MQTT_BROKER:-tcp://broker.mqttdashboard.com:1883}
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      # Link público (perfil online): visitante vê o dashboard sem login, só leitura
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS_ENABLED:-false}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/json/pulsopnaat-monitoramento.json
      # Repassados para expansão ${...} no provisioning do datasource
      - INFLUXDB_ORG=${INFLUXDB_ORG:-myorg}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-mqtt_data}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-my-super-secret-admin-token}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - influxdb

  # Publica o Grafana num endereço HTTPS público (https://<aleatório>.trycloudflare.com), sem conta
  # nem porta aberta no roteador. Só sobe com: docker compose --profile online up -d
  # O endereço muda a cada reinício do contêiner: docker compose logs tunel | grep trycloudflare
  tunel:
    image: cloudflare/cloudflared:latest
    container_name: tunel
    restart: unless-stopped
    profiles: ["online"]
    command: tunnel --no-autoupdate --url http://grafana:3000
    depends_on:
      - grafana

volumes:
  influxdb-data:
  grafana-data:
